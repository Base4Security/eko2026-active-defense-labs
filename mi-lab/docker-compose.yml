# ════════════════════════════════════════════════════════════════════════
# Laboratorio · Active Cyber Defense · Ekoparty 2026
#
# Tres servicios, dos formas distintas de engañar:
#
#   portal      un sistema REAL. Tiene datos, usuarios y documentos; el
#               engaño es sólo lo que el alumno le agrega encima.
#
#   cowrie      sistemas FALSOS enteros. Nadie legítimo tiene motivo para
#   opencanary  llegar, así que detectan a cualquiera que los toque.
#
# Los ejercicios usan las dos. La diferencia entre ellas es la mitad de las
# decisiones de diseño del curso.
#
#   docker compose up -d --build
#   docker compose ps
# ════════════════════════════════════════════════════════════════════════

services:

  # ─── Sistema real · el engaño va adentro ─────────────────────────────
  portal:
    build: ./portal
    container_name: b4-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Las seis superficies plantables, montadas desde el disco.
      # Editás un archivo acá afuera y el portal lo ve en la próxima
      # recarga del navegador: no hace falta reiniciar nada.
      - ./portal/config:/portal/config
      - ./portal/data:/portal/data
      - ./portal/archivos:/portal/archivos
      - ./portal/static:/portal/static
      - ./portal/logs:/portal/logs
    networks: [lab]

  # ─── Sistema falso entero · honeypot SSH ─────────────────────────────
  # Interacción media: el adversario obtiene un shell falso y cada comando
  # que tipea queda en JSON estructurado. Viene SIN configurar a propósito:
  # el E1 es encontrar qué lo delata y el E5 es arreglarlo.
  cowrie:
    image: cowrie/cowrie:latest
    container_name: b4-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      # OJO con estas dos rutas. El WorkingDir de la imagen es
      # /cowrie/cowrie-git, asi que el var y el etc que cowrie usa de verdad
      # cuelgan de ahi: montados en /cowrie/var y /cowrie/etc los bind mounts
      # quedan inertes y el JSON de sesiones muere con el contenedor, que es
      # justo la evidencia que el E7 y el E13 necesitan.
      #
      # El log se monta en el directorio profundo, no en var/: cowrie no crea
      # var/log/cowrie si falta, y montar var/ entero tapa el arbol que la
      # imagen trae (lib/cowrie/tty y demas) y le cuelga las sesiones.
      - ./cowrie/log:/cowrie/cowrie-git/var/log/cowrie
      # Vacio a proposito. Aca va el cowrie.cfg que se escribe en el E5.
      - ./cowrie/etc:/cowrie/cowrie-git/etc
      # Volumen nombrado, no bind mount: docker copia adentro el arbol que la
      # imagen ya trae (tty, downloads, snapshots), asi que no lo tapa. Sirve
      # para que las claves SSH del honeypot no se regeneren en cada arranque:
      # un servidor que cambia de fingerprint cada vez se delata solo.
      - cowrie-lib:/cowrie/cowrie-git/var/lib/cowrie
    networks: [lab]

  # ─── Sistemas falsos enteros · servicios varios ──────────────────────
  # SMB, un portal HTTP de login y un MSSQL. Cada uno captura una cosa
  # distinta del adversario, y eso es el ejercicio E4.
  opencanary:
    build: ./opencanary
    container_name: b4-opencanary
    restart: unless-stopped
    ports:
      - "8081:8081"    # portal de login falso
      - "1445:445"     # SMB   (445 suele estar tomado en el host)
      - "1433:1433"    # MSSQL
    volumes:
      - ./opencanary/logs:/var/tmp/opencanary
    networks: [lab]

volumes:
  cowrie-lib:

networks:
  lab:
    name: b4-lab
