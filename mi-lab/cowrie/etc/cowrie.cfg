# ════════════════════════════════════════════════════════════════════════
# Cowrie · configuración mínima
#
# Este archivo NO endurece el honeypot. No toca el banner, ni el hostname,
# ni el filesystem falso, ni ninguno de los delatores que el E1 manda a
# buscar: el honeypot viene flojo a propósito y arreglarlo es el E5.
#
# Lo único que hay acá es cómo se escribe el log, y está por un motivo
# concreto: el default de Cowrie (logtype = rotating) reabre el JSON con
# open(path, "rb+") en cada arranque, y como lo crea con modo 0400 falla
# con "Permission denied" en el segundo start. El plugin de salida muere
# sin avisar y el honeypot deja de escribir cowrie.json — que es justo la
# evidencia que necesitan el E7 y el E13.
#
# Con logtype = plain se abre en modo append y el problema desaparece.
#
# El E5 escribe acá abajo. Empezá agregando tu propia sección [honeypot]
# con hostname y version, o extendé la que ya está.
# ════════════════════════════════════════════════════════════════════════

[honeypot]
logtype = plain
