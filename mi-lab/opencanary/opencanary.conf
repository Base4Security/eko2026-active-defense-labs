{
  "device.node_id": "EKO-HNP01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],

  "http.banner": "Apache/2.4.57 (Ubuntu)",
  "http.enabled": true,
  "http.port": 8081,
  "http.skin": "sigcon",
  "http.skindir": "/opt/skin",

  "smb.auditfile": "/var/tmp/opencanary/smb.log",
  "smb.enabled": true,

  "mssql.enabled": true,
  "mssql.port": 1433,
  "mssql.version": "2012",

  "ftp.enabled": false,
  "ssh.enabled": false,
  "telnet.enabled": false,
  "redis.enabled": false,
  "mysql.enabled": false,
  "vnc.enabled": false,
  "tftp.enabled": false,
  "ntp.enabled": false,
  "tcpbanner.enabled": false,
  "portscan.enabled": false,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": { "format": "%(message)s" }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/tmp/opencanary/opencanary.log"
        },
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        }
      }
    }
  }
}
