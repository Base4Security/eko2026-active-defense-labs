# La correa entre las dos mitades del SMB falso.
#
# smbd escribe la auditoria a syslog con facility LOCAL7 y el tag
# "smbd_audit" (ver smb.conf), y esto la deja en el archivo que
# opencanary.conf declara como "smb.auditfile". El modulo samba de
# OpenCanary tail-ea ese archivo y emite el evento.
#
# El "& stop" evita que la misma linea se duplique en /var/log/syslog.

local7.*    /var/tmp/opencanary/smb.log
& stop
