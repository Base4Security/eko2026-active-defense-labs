; ═══════════════════════════════════════════════════════════════════════
; SMB falso · Active Cyber Defense
;
; El modulo "samba" de OpenCanary NO levanta un servidor SMB: lo unico que
; hace es tail-ear un archivo de auditoria esperando lineas "smbd_audit".
; El que las escribe es un smbd de verdad con el VFS full_audit, y esa es
; la mitad que falta si uno se guia solo por opencanary.conf.
;
; Sin este archivo el puerto 1445 "parece abierto" desde el host --el
; docker-proxy acepta el TCP igual-- pero nada responde y el toque no queda
; registrado en ningun lado. Es exactamente el falso positivo que el E13
; ensena a no comerse.
; ═══════════════════════════════════════════════════════════════════════

[global]
   workgroup = EKOFINANCE
   netbios name = SIGCON-FS01
   server string = SIGCON - Archivos de Contabilidad

   ; Cualquier usuario desconocido entra como invitado. Es lo que se quiere
   ; en un honeypot: el intento queda registrado con el nombre que el
   ; adversario PIDIO (%U), que es el dato que interesa.
   security = user
   map to guest = Bad User
   guest account = nobody

   ; Solo 445. Sin NetBIOS: nmbd en 137/139 no aporta nada y es una pieza
   ; mas que mantener.
   disable netbios = yes
   smb ports = 445

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   ; El debug propio de smbd va aparte. El archivo que mira OpenCanary lo
   ; escribe rsyslog y conviene que no tenga ruido de arranque adentro.
   log file = /var/log/samba/log.smbd
   log level = 1
   max log size = 0

   ; El orden de los campos NO es libre: opencanary/modules/samba.py los lee
   ; por posicion. full_audit agrega operacion|resultado|ruta al final.
   ;   %U usuario · %I ip cliente · %i ip servidor · %m nombre cliente
   ;   %S share · %L nombre servidor · %R protocolo · %a arquitectura
   ;   %T fecha · %D dominio
   ;
   ; OJO con esta lista: si UNA sola operacion no existe en la version de
   ; samba instalada, full_audit invalida la lista entera y rechaza el
   ; connect --el share deja de montar, no solo de auditar--. El sintoma es
   ; "Invalid success operations list. Failing connect" en este mismo log, y
   ; del lado del cliente un NT_STATUS_UNSUCCESSFUL que no explica nada.
   ; "opendir" ya no existe en samba 4.22: ahora son fdopendir y readdir.
   vfs objects = full_audit
   full_audit:prefix = %U|%I|%i|%m|%S|%L|%R|%a|%T|%D
   full_audit:success = connect fdopendir readdir openat open create_file read pread pread_send pread_recv
   full_audit:failure = connect
   ;
   ; syslog SI, aunque adentro de un contenedor sea tentador evitarlo. Con
   ; syslog = no samba escribe la misma linea por su canal de debug, pero sin
   ; el tag "smbd_audit:" que la pone ahi el openlog() del camino de syslog
   ; --y ese tag es justo lo que OpenCanary busca con su regex--. Las lineas
   ; quedarian perfectas en el archivo y el honeypot no emitiria un solo
   ; evento. Por eso el contenedor corre un rsyslog: ver rsyslog-smb.conf.
   full_audit:syslog = yes
   full_audit:facility = LOCAL7
   full_audit:priority = NOTICE

[Contabilidad]
   comment = Cierres mensuales y conciliaciones
   path = /srv/contabilidad
   browseable = yes
   read only = yes
   guest ok = yes
