# ════════════════════════════════════════════════════════════════════════
# Stack de demo · Active Cyber Defense v3 (Ekoparty 2026)
#
# NIVEL 1 — corre en la máquina del instructor y se proyecta.
# Los alumnos no lo levantan: los laboratorios son de papel. Esto existe
# para que el diseño tenga un ancla concreta (LAB 02) y para que la
# telemetría del engaño se vea entrando en vivo (LAB 03).
#
#   docker compose up -d
#   docker compose logs -f cowrie
#   docker compose down
#
# Para el kit que se reparte, ver README.md → "Nivel 2".
# ════════════════════════════════════════════════════════════════════════

services:

  # ─── Honeypot SSH/Telnet de interacción media ───────────────────────
  # Es el artefacto del demo del LAB 02. Un adversario obtiene un shell
  # falso; cada comando que tipea queda registrado en JSON estructurado.
  # Propiedad a mostrar: ningún usuario legítimo tiene motivo para llegar
  # acá, así que la relación señal/ruido es perfecta.
  cowrie:
    # TODO antes de repartir el kit: fijar un digest en lugar de un tag
    # móvil, para que la imagen distribuida sea reproducible.
    #   image: cowrie/cowrie@sha256:<digest>
    image: cowrie/cowrie:latest
    container_name: b4-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"     # ssh    → ssh root@localhost -p 2222
      - "2223:2223"     # telnet
    volumes:
      - ./cowrie/var:/cowrie/var
      - ./cowrie/etc:/cowrie/etc:ro
    networks: [deception]

  # ─── Sumidero DNS con registro de consultas ─────────────────────────
  # Contraparte del honeyfile con beacon: el documento señuelo emite una
  # consulta DNS a un subdominio único al abrirse, y acá se ve llegar.
  # Muestra un canal de detección que no requiere agente en el endpoint.
  #   dig @localhost -p 5354 65288a6b46da2.tokens.ekofinance.local
  #
  # Se publica en 5354 y no en 5353 a propósito: en macOS el 5353 lo ocupa
  # mDNSResponder y el arranque falla con "address already in use".
  dns-beacon:
    build: ./dns-beacon
    container_name: b4-dns-beacon
    restart: unless-stopped
    ports:
      - "5354:5353/udp"
    networks: [deception]

  # ─── Spider trap ────────────────────────────────────────────────────
  # Laberinto de enlaces infinito. Sirve para mostrar el objetivo Affect
  # de Engage: degradar el reconocimiento automatizado en lugar de
  # bloquearlo, que además no le avisa al adversario que fue detectado.
  #   curl -s http://localhost:8080/ | head
  spidertrap:
    build: ./spidertrap
    container_name: b4-spidertrap
    restart: unless-stopped
    ports:
      - "8080:8000"
    networks: [deception]

networks:
  deception:
    name: b4-deception
